<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Барбершопи Львова</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(135deg, #1c1c1c, #2b2b2b);
      --card: #ffffff;
      --accent: #c6a14a;
      --text: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .card-content {
      padding: 24px;
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .card p {
      color: #555;
      line-height: 1.6;
      font-size: 15px;
    }

    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 14px;
      background: var(--accent);
      color: #111;
      font-size: 13px;
      font-weight: 600;
      border-radius: 30px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Перший барбершоп (оновлений) -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1200&q=80" alt="Сучасний барбершоп" />
      <div class="card-content">
        <h2>Royal Beard Barbershop</h2>
        <p>Сучасний преміальний барбершоп у центрі Львова. Стильні стрижки, догляд за бородою та атмосфера справжнього чоловічого клубу.</p>
        <span class="badge">Преміум клас</span>
      </div>
    </div>

    <!-- Інші барбершопи (приклад) -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1622287162716-f311baa1a2b8?auto=format&fit=crop&w=1200&q=80" alt="Барбершоп" />
      <div class="card-content">
        <h2>Gentleman’s Cut</h2>
        <p>Класичні та сучасні чоловічі стрижки, професійні барбери та бездоганний сервіс.</p>
        <span class="badge">Топ вибір</span>
      </div>
    </div>

  </div>

</body>
</html>
